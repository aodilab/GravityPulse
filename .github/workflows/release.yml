name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Generate icon and run audit
        run: |
          python build.py --icon
          python build.py --audit
      - name: Build portable Windows package
        run: pyinstaller --noconfirm --clean packaging/gravitypulse.spec
      - name: Archive portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/GravityPulse -DestinationPath GravityPulse-win64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityPulse-win64
          path: GravityPulse-win64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GravityPulse-win64.zip
          generate_release_notes: true
